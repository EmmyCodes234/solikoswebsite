    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <body class="bg-[#161616] text-[#f0f0f0] font-sans antialiased selection:bg-[#f0f0f0] selection:text-[#161616]">
    <div id="root"></div>
    <!-- Hidden form for Netlify to detect in our SPA environment -->
    <form hidden method='post' name='partnership'>
      <input type="text" name="companyName" />
      <select name="projectType">
        <option value="hardware">Hardware Procurement</option>
        <option value="minigrid">Mini-Grid</option>
        <option value="consultancy">Consultancy</option>
        <option value="infrastructure">Infrastructure</option>
      </select>
      <input type="text" name="selectedProduct" />
      <input type="email" name="email" />
      <input type="hidden" name="form-name" value="partnership" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
